# Dropped: live blogs, video, opinion, quizzes, lifestyle and product reviews. Any headline with a
# question mark counts as analysis or opinion and is dropped.
exclude_title:
  - 'live updates'
  - 're:\blive:'
  - 'live blog'
  - 'video'
  - 're:^watch\b'
  - 're:\bwatch:'
  - 'opinion'
  - 'op-ed'
  - 'quiz'
  - 're:\breviews?:'
  - 'hands-on'
  - 'podcast'
  - 'how to'
  - 're:\bbest .{0,40} to buy\b'
  - 'couch(?:es)?'
  - 'recipes?'
  - 'travel'
  - 'retire(?:ment)?'
  - 'mortgages?'
  - 'credit cards?'
  - 'personal finance'
  - 'horoscope'
  - 're:\bi''?d buy\b'
  - 're:\b\d+ (?:brilliant|top|best|great|unstoppable) (?:stocks|etfs)\b'
  - 'millionaire'
  - 'dividend stocks?'
  - 're:\bshould you buy\b'
  - 'stocks? to buy'
  - 'things (?:investors|to know|you need)'
  - 'cramer'
  - 'motley fool'
  - 'reports transactions'
  - 'accepts invitation'
  - 're:\?'
  - 're:^not [^.]{1,30}\. not\b'
  - 're:\bshould (?:fear|own|buy|sell|worry)\b'
  - 'worth (?:buying|holding|owning)'
  - 'etfs? in focus'
  - 'zacks'

# Dropped by link path.
exclude_link:
  - 're:/video/'
  - 're:/videos/'
  - 're:/live-news/'
  - 're:/live/'
  - 're:/opinion/'
  - 're:/podcast'
  - 're:/select/'
  - 're:/personal-finance/'
