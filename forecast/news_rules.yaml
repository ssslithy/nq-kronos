# Tech news filter and significance for the page's news list (forecast/page_data.py: news()).
# Tune here; no code change needed. Every entry is a case-insensitive regular expression,
# matched on word boundaries (\b...\b) unless it starts with 're:' (then used as written).
#
# Relevance (the item is kept): the headline OR the start of the RSS summary mentions a
#   Nasdaq-100 company (top_names, other_names), a sector term, or a macro term,
#   and the headline / link match none of the exclude patterns.
# Significance, from the HEADLINE only (so an item kept only because of its summary is 1):
#   3  macro term, or a policy_3 term, or a top name together with a major_event term
#   2  any Nasdaq-100 name (top or other), a sector term, or a top name with a rating term
#   1  everything else that passed the relevance filter


