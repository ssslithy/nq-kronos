# Earnings results or guidance (not dates or previews): 3 bars with a Nasdaq-100 company.
earnings_result:
  - 'reports? (?:q[1-4]|first|second|third|fourth|quarterly|record)'
  - '(?:q[1-4]|first-quarter|second-quarter|third-quarter|fourth-quarter|full-year) (?:results|earnings)'
  - 'earnings (?:beat|beats|miss|misses|top|tops|topped|surge|surges|jump|jumps|fall|falls|slump|slumps|disappoint\w*)'
  - '(?:beats?|tops?|topped|miss(?:es|ed)?) (?:estimates|expectations|forecasts|views)'
  - 'guidance'
  - '(?:raises?|lifts?|cuts?|lowers?|boosts?|trims?|slashes?|hikes?) (?:its |annual |full-year |\d{4} )?(?:forecast|outlook|guidance)'
  - '(?:weak|weaker|strong|stronger|soft|upbeat|downbeat|disappointing|bleak|rosy|dismal|solid|lower|higher|cautious)(?: \w+)? (?:forecast|guidance|outlook)'
  - '(?:revenue|profit|earnings|net income) (?:nearly |more than )?(?:doubles?|triples?|rises?|falls?|jumps?|grows?|beats?|misses?|surges?|slumps?|soars?|drops?|declines?|tops?)'
  - 'in q[1-4]'
  - 'results'

