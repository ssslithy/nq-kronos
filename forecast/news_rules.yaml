# Tech news filter, significance and story clustering for the page's news list
# (forecast/page_data.py: news()). Tune here; no code change needed. Entries are case-insensitive
# regular expressions, matched on word boundaries unless they start with 're:' (used as written).
#
# Relevance (kept) - none of the exclude patterns, and one of:
#   a Nasdaq-100 company (top_names / other_names) in the headline;
#   a macro term in the headline;
#   a sector term AND a market word in the headline (the piece moves a sector), so generic
#   AI / workplace pieces without a company are dropped.
# Market wraps (market_wrap) and movers roundups (movers_roundup) are not listed and not in the
# split; only if fewer than 3 other items remain is the single most recent wrap shown, at 1 bar.
# Significance (bars), from the headline:
#   1  anything matching always_1 (earnings-date notices, previews, "stocks to watch", week-ahead
#      calendars), whatever else it mentions
#   3  a macro term; or a Nasdaq-100 company as the subject (named in the first 25 characters) with
#      an earnings_result term; or a top-8 company as the subject with a major_event term; or a
#      market_shock term about a top-8 company, the Nasdaq or chips / AI / tech stocks
#   2  hard news with the company as the subject (named in the first 25 characters) or a sector
#      term, and a hard_action ( results / guidance, probe, lawsuit or ruling, deal, launch, outage,
#      upgrade / downgrade, layoffs, CEO / CFO exit, buyback, production halt, export curbs) about a
#      Nasdaq-100 company or the sector
#   1  everything else that passed the filter: commentary, interviews, features, lower-level moves
# Target over a typical day: about 20% 3 bars, 40% 2 bars, 40% 1 bar (news.json logs the split).
# Target: about 20% of the listed items at 3 bars.
# Clustering (the story is shown with its most significant headline, ties: source_rank, then the
# earliest; at the earliest time): two headlines within 24 hours are one story if they name a common
# Nasdaq-100 company and share an event_words group, or have the same main company and a shared
# proper name (e.g. Huang; not for Title Case headlines), or near-identical titles. The story keeps the
# highest-ranked source (source_rank) and the earliest time.

