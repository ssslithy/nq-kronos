# Scheduled US releases for the GARCH vol event flag (forecast/garch_vol.py), 2026-2027.
# All times New York (Eastern). Dates copied from the official calendars below on 2026-11-08.
#
# UPDATE EACH JANUARY (or when an agency revises its calendar): add the new year's dates from
# the same pages, and rename/extend the file if needed (EVENTS_FILE in garch_vol.py). After the
# last date covered here the page shows "event calendar not loaded" instead of "no events".
#
# Coverage gaps:
# - Retail sales Jan-Sep 2026 (already past) are only in Census's Excel history file; the
#   page lists Oct 2026 onwards. December 2027 retail sales is "to be announced" (Jan 2028).
# - The Fed calendar page gives meeting days, not times. The decision (statement) is
#   released at 14:00 on the second day; the date below is that second day.

covered_from: 2026-01-01   # forecasts before this (the 1-year backfill) show "not loaded"
covered_until: 2027-12-31

types:
  FOMC:
    impact: 3            # page calendar signal: 3 = high, 2 = medium
    name: FOMC decision
    release: Federal Open Market Committee policy statement (second day of the meeting)
    time: "14:00"
    sources:
      - https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    dates:
      # 2026 meetings: Jan 27-28, Mar 17-18*, Apr 28-29, Jun 16-17*, Jul 28-29, Sep 15-16*, Oct 27-28, Dec 8-9*
      - 2026-01-28
      - 2026-03-18
      - 2026-04-29
      - 2026-06-17
