name: forecast

on:
  schedule:
    - cron: "7 * * * *"          # hourly at :07 UTC; the script exits early when NQ is closed
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if NQ is closed"
        type: boolean
        default: true
      samples:
        description: "Number of Kronos paths"
        type: string
        default: "100"
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**", ".github/workflows/forecast.yml"]

permissions:
  contents: write                 # commit site/data
  pages: write                    # deploy to GitHub Pages
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      NQ_SAMPLES: ${{ inputs.samples || '100' }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forecast/requirements.txt

      - name: Restore Hugging Face weights cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache
          key: hf-kronos-small-901c26c-tokenizer-0e01173

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r forecast/requirements.txt

      - name: Run forecast
        id: run
        run: |
          set +e
          SKIP="--skip-if-closed"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then SKIP=""; fi
          python forecast/run_forecast.py $SKIP
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit site/data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no data changes"; exit 0
          fi
          GEN=$(python -c "import json;print(json.load(open('site/data/latest.json'))['generated_utc'])")
          git commit -q -m "forecast: data as of ${GEN}"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true; break
            fi
            echo "push attempt $i/3 failed"
            sleep $((i * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::could not push the data commit after 3 attempts (git errors above); nothing deployed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Fail the run if the forecast failed
        if: steps.run.outputs.code != '0'
        run: |
          echo "run_forecast.py exited with ${{ steps.run.outputs.code }}; previous latest.json kept, status.json records the error"
          exit 1

  deploy:
    needs: forecast
    if: >-
      always() && (
        needs.forecast.outputs.changed == 'true' ||
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:                    # shared with the other workflow: one Pages deploy at a time
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}       # branch head, so the data commit above is included
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
