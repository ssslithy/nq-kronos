name: deploy

# Deploys the page when site/ code changes (data-only pushes don't: the daily garch-vol run
# deploys its own data), or by hand (Actions -> deploy -> Run workflow). Until 15 Nov 2026 this
# workflow also ran Kronos-small by hand; Kronos is retired (lab/archive/kronos/).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**", ".github/workflows/forecast.yml"]

permissions:
  contents: read
  pages: write                    # deploy to GitHub Pages
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:                    # shared with garch_vol.yml: one Pages deploy at a time
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}       # branch head, so the latest data commit is included
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
