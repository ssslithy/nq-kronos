name: garch-vol

# The site's daily run, as of the 08:00 New York bar close. GitHub cron is UTC-only, best
# effort, and can start late or not at all (on 9 Nov 2026 the only in-window slot, 13:05 UTC,
# never fired). So it fires 7 times, at :07 / :27 / :47 past 12 and 13 UTC and at 14:07 UTC:
# 4 slots land in 08:00-09:25 NY in both EDT (12:00-13:25 UTC) and EST (13:00-14:25 UTC).
# forecast/run_vol.py decides: the first in-window run forecasts, every other run exits quietly
# ("outside 08:00-09:25" or "already made"). Off the top of the hour, where GitHub drops most
# scheduled runs. When it makes a forecast:
#   vol     1pm->1pm London volatility (run_vol.py; HAR-RV since Nov 2026, the job keeps its
#           old name) + phone alert, then calendar / Treasuries / Fed odds / news (fail-soft),
#           commit, push   (~2-6 min)
#   deploy  Pages deploy of the vol forecast, straight away
#   kronos  Kronos-small from the same 07:00-08:00 NY bar (run_forecast.py --origin), its own
#           job with a 15-minute limit; if it fails or times out, only Kronos is marked stale
#   deploy-kronos  second Pages deploy with the Kronos forecast (or its stale flag)
# Kronos can't delay or block the vol commit, alert or deploy.
on:
  schedule:
    - cron: "7,27,47 12 * * 1-5"
    - cron: "7,27,47 13 * * 1-5"
    - cron: "7 14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Forecast from the latest daily origin even outside 08:00-09:25 NY"
        type: boolean
        default: false
      test_alert:
        description: "Send a TEST phone alert (ntfy) with the latest forecast"
        type: boolean
        default: false

permissions:
  contents: write                 # commit site/data
  pages: write                    # deploy to GitHub Pages
  id-token: write

concurrency:
  group: garch-vol
  cancel-in-progress: false

jobs:
  vol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      made: ${{ steps.run.outputs.made }}
      origin: ${{ steps.run.outputs.origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forecast/requirements-vol.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r forecast/requirements-vol.txt

      - name: Run vol forecast
        id: run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}     # optional: unset = no phone alert
        run: |
          set +e
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python forecast/run_vol.py $FORCE
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Send a test alert
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        continue-on-error: true                       # a failed test never blocks the data commit
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python forecast/vol_alert.py --send

      - name: Commit site/data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/vol_*                       # the vol job's files; Kronos commits its own
          for f in calendar treasuries news fed_odds; do [ -f "site/data/$f.json" ] && git add -- "site/data/$f.json"; done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no data changes"; exit 0
          fi
          ORIGIN=$(python -c "import json;print(json.load(open('site/data/vol_status.json')).get('forecast_origin_utc'))")
          git commit -q -m "vol: daily forecast (HAR-RV), origin ${ORIGIN}"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true; break
            fi
            echo "push attempt $i/3 failed"
            sleep $((i * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::could not push the data commit after 3 attempts (git errors above); nothing deployed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Fail the run if the forecast failed
        if: steps.run.outputs.code != '0'
        run: |
          echo "run_vol.py exited with ${{ steps.run.outputs.code }}; previous vol_latest.json kept and marked stale, vol_status.json records the error"
          exit 1

  deploy:
    needs: vol
    if: always() && needs.vol.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:                    # shared with the other workflow: one Pages deploy at a time
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}       # branch head, so the data commit above is included
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  kronos:
    needs: vol
    if: needs.vol.outputs.made == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25                 # install ~3 min + Kronos (own 15-min limit) + commit
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      NQ_SAMPLES: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}         # branch head, after the GARCH data commit
          submodules: recursive          # vendor/kronos

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forecast/requirements.txt

      - name: Restore Hugging Face weights cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache
          key: hf-kronos-small-901c26c-tokenizer-0e01173

      - name: Install Kronos dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r forecast/requirements.txt

      - name: Run Kronos from the same origin
        id: kronos
        timeout-minutes: 15
        continue-on-error: true
        run: python forecast/run_forecast.py --origin "${{ needs.vol.outputs.origin }}" --horizon 23

      - name: Mark Kronos stale if it failed or timed out
        if: steps.kronos.outcome != 'success'
        run: |
          echo "::warning::Kronos ${{ steps.kronos.outcome }} for origin ${{ needs.vol.outputs.origin }}; previous Kronos forecast kept and marked stale (GARCH unaffected)"
          python forecast/run_forecast.py --mark-stale "daily Kronos run ${{ steps.kronos.outcome }} (failed or over 15 min) for origin ${{ needs.vol.outputs.origin }}"

      - name: Commit site/data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no data changes"; exit 0
          fi
          git commit -q -m "kronos: daily forecast (${{ steps.kronos.outcome }}), origin ${{ needs.vol.outputs.origin }}"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true; break
            fi
            echo "push attempt $i/3 failed"
            sleep $((i * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::could not push the Kronos data commit after 3 attempts"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy-kronos:
    needs: [kronos, deploy]             # after the GARCH deploy, never instead of it
    if: always() && needs.kronos.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-kronos      # the GARCH deploy already uploaded "github-pages" in this run
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-kronos
