name: garch-vol

# The site's daily run, as of the 09:00 New York bar close (08:00 until 13 Nov 2026). GitHub cron is UTC-only, best
# effort, and can start late or not at all (on 9 Nov 2026 the only in-window slot, 13:05 UTC,
# never fired). The vol-timer workflow now starts it on time; these slots are the backup. It
# fires 7 times, at :07 / :27 / :47 past 13 and 14 UTC and at 15:07 UTC:
# 4 slots land in 09:00-10:25 NY in both EDT (13:00-14:25 UTC) and EST (14:00-15:25 UTC).
# forecast/run_vol.py decides: the first in-window run forecasts, every other run exits quietly
# ("before 09:00" or "already made"; a run after 10:25 still forecasts once, late). Off the top of the hour, where GitHub drops most
# scheduled runs. When it makes a forecast:
#   vol     9am->9am New York (2pm->2pm London) volatility (run_vol.py; HAR-RV since Nov 2026, the job keeps its
#           old name) + phone alert, then calendar / Treasuries / Fed odds / news (fail-soft),
#           commit, push   (~2-6 min)
#   deploy  Pages deploy of the vol forecast, straight away (one retry, 60 s later, if GitHub's deploy fails)
# Every run, forecast or not, also checks the live page: if its vol_latest.json differs from main's,
# a deploy failed earlier (24 and 25 Nov 2026) and this run deploys again.
# (Kronos-small used to run here as two more jobs; retired 15 Nov 2026, see lab/archive/kronos/.)
on:
  schedule:
    - cron: "7,27,47 13 * * 1-5"
    - cron: "7,27,47 14 * * 1-5"
    - cron: "7 15 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Forecast from the latest daily origin even outside 09:00-10:25 NY"
        type: boolean
        default: false
      test_alert:
        description: "Send a TEST phone alert (ntfy) with the latest forecast"
        type: boolean
        default: false

permissions:
  contents: write                 # commit site/data
  pages: write                    # deploy to GitHub Pages
  id-token: write

concurrency:
  group: garch-vol
  cancel-in-progress: false

jobs:
  vol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      stale: ${{ steps.live.outputs.stale }}
      made: ${{ steps.run.outputs.made }}
      origin: ${{ steps.run.outputs.origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forecast/requirements-vol.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r forecast/requirements-vol.txt

      - name: Run vol forecast
        id: run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}     # optional: unset = no phone alert
        run: |
          set +e
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python forecast/run_vol.py $FORCE
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Send a test alert
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        continue-on-error: true                       # a failed test never blocks the data commit
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python forecast/vol_alert.py --send

      - name: Commit site/data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/vol_*                       # the vol job's files
          for f in since_close calendar treasuries news fed_odds; do [ -f "site/data/$f.json" ] && git add -- "site/data/$f.json"; done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no data changes"; exit 0
          fi
          ORIGIN=$(python -c "import json;print(json.load(open('site/data/vol_status.json')).get('forecast_origin_utc'))")
          git commit -q -m "vol: daily forecast (HAR-RV), origin ${ORIGIN}"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true; break
            fi
            echo "push attempt $i/3 failed"
            sleep $((i * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::could not push the data commit after 3 attempts (git errors above); nothing deployed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check the live page has main's forecast
        id: live
        if: always()
        run: |
          # After a failed Pages deploy the page keeps the old forecast, and later runs find no new
          # data, so nothing redeploys. Compare the live vol_latest.json with main's; differ -> deploy.
          git fetch -q origin "${GITHUB_REF_NAME}" || true
          want=$(git show "origin/${GITHUB_REF_NAME}:site/data/vol_latest.json" 2>/dev/null \
                 | python -c "import json,sys;print(json.load(sys.stdin).get('generated_utc'))" 2>/dev/null || true)
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/data/vol_latest.json?check=${GITHUB_RUN_ID}"
          have=$(curl -fsS --max-time 20 "$url" | python -c "import json,sys;print(json.load(sys.stdin).get('generated_utc'))" 2>/dev/null || true)
          echo "main: ${want:-?}  live: ${have:-unreachable}"
          if [ -n "$want" ] && [ "$want" != "None" ] && [ "$want" != "$have" ]; then
            echo "::warning::the live page is behind main (an earlier deploy failed); deploying again"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail the run if the forecast failed
        if: steps.run.outputs.code != '0'
        run: |
          echo "run_vol.py exited with ${{ steps.run.outputs.code }}; previous vol_latest.json kept and marked stale, vol_status.json records the error"
          exit 1

  deploy:
    needs: vol
    if: always() && (needs.vol.outputs.changed == 'true' || needs.vol.outputs.stale == 'true')
    runs-on: ubuntu-latest
    concurrency:                    # shared with forecast.yml: one Pages deploy at a time
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}       # branch head, so the data commit above is included
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true         # GitHub sometimes can't find the bundle just uploaded (24/25 Nov 2026)
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: echo "::warning::Pages deploy failed; retrying in 60 s with a fresh upload"; sleep 60
      - if: steps.deployment.outcome == 'failure'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-retry
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-retry
